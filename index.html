<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunderbolts Roster</title>
<style>
:root{--navy:#0a1b3d;--royal:#1550c9;--gold:#ffc81f;--bg:#f3f5fa;--card:#fff;--ink:#0a1b3d;--mute:#5b6784;--line:#d8deeb;--bat:#ffc81f;--bat-ink:#3b2a00;--in:#1550c9;--in-ink:#fff;--out:#0f8a7e;--out-ink:#fff;--bench:#f6d9d9;--bench-ink:#a32020}
@media(prefers-color-scheme:dark){:root{--bg:#07122b;--card:#0e2048;--ink:#eef2fb;--mute:#9fb0d4;--line:#1f3566;--bench:#4a1f27;--bench-ink:#ff9d9d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.disp{font-family:Bahnschrift,"Arial Narrow","Roboto Condensed","Franklin Gothic Medium",system-ui,sans-serif;font-weight:800;font-style:italic;letter-spacing:.01em}
header{background:linear-gradient(135deg,var(--navy),var(--royal));color:#fff;padding:14px 16px;border-bottom:4px solid var(--gold)}
.brand{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand svg{width:34px;height:44px;flex:none}
.brand h1{margin:0;font-size:clamp(22px,6vw,32px);line-height:1;text-transform:uppercase}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2{margin:0;font-size:24px}
.head{display:flex;justify-content:space-between;align-items:center}.head .link{min-height:36px}
.panel .head~p.away,.panel .head~p.err{margin-top:8px}
.panel p{margin:0 0 12px;color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chip{min-height:48px;border-radius:12px;border:2px solid var(--royal);background:var(--royal);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:transparent;color:var(--mute);border-style:dashed;border-color:var(--line);text-decoration:line-through}
.panel p.away{margin:0 0 10px;font-size:14px}
.away b{color:var(--ink);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
button.btn{min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--royal);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
button.btn.go{background:var(--gold);border-color:var(--gold);color:var(--navy)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;min-height:48px;padding:0 8px;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel p.err{background:var(--bench);color:var(--bench-ink);border-radius:10px;padding:10px 12px;font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;table-layout:fixed}
th{background:var(--navy);color:#fff;padding:10px 4px;font-size:15px;text-align:center}
th:first-child{text-align:left;padding-left:10px;width:36%}
th.pv{background:var(--gold);color:var(--navy)}
td{padding:6px 3px;border-top:1px solid var(--line);text-align:center;height:46px}
td.pv,tr.pv td{background:rgba(255,200,31,.18)}
td:first-child{text-align:left;padding-left:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:12px;margin-right:6px}
@media(prefers-color-scheme:dark){.no{background:var(--gold);color:var(--navy)}}
.pos{display:block;text-align:center;overflow:hidden;padding:6px 2px;border-radius:8px;font-size:11px;font-weight:700;line-height:1.1}
.pos.bat{background:var(--bat);color:var(--bat-ink)}.pos.in{background:var(--in);color:var(--in-ink)}.pos.out{background:var(--out);color:var(--out-ink)}.pos.bench{background:var(--bench);color:var(--bench-ink)}
.empty{color:var(--line)}
.ab{display:inline}.fu{display:none}
@media(min-width:560px){.ab{display:none}.fu{display:inline}.pos{font-size:13px;padding:8px 4px}th:first-child{width:24%}}
.views{display:flex;gap:6px;margin:0 0 12px;align-items:center}.views .sp{flex:1}
.pill{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.pill:disabled{opacity:.4;cursor:not-allowed}.pill:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fld{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.grass{fill:#cfe9d6}.dirt{fill:#e8d8b8}.base rect{fill:#fff;stroke:#8a7a55}
@media(prefers-color-scheme:dark){.grass{fill:#14452f}.dirt{fill:#5a4a2a}}
.fz text{text-anchor:middle;font-family:system-ui,sans-serif}.fz .l{font-size:14px}.fz .n{font-size:22px;font-weight:700}
.fz.bat rect{fill:var(--bat)}.fz.bat text{fill:var(--bat-ink)}.fz.in rect{fill:var(--in)}.fz.out rect{fill:var(--out)}.fz.in text,.fz.out text{fill:#fff}
.fz.gone rect{fill:none;stroke:var(--mute);stroke-dasharray:4 4;opacity:.6}.fz.gone text{fill:var(--mute);opacity:.6}
p.bench{margin:12px 0 0;padding:0;font-size:14px;color:var(--mute)}p.bench span{background:var(--bench);color:var(--bench-ink);font-weight:700;padding:4px 12px;border-radius:999px;margin-left:6px}
button.pos{border:0;width:100%;font-family:inherit;cursor:pointer}
.pos.sit{background:var(--line);color:var(--mute)}
.pos.ed::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:4px;vertical-align:middle}
.sheet{margin:12px 0 0}.sheet .bar{margin-top:8px}.sheet small{font-weight:400;opacity:.8}
p.bench span.o{background:var(--line);color:var(--mute)}
footer{max-width:760px;margin:0 auto;padding:0 16px 24px;text-align:right}
</style>
</head>
<body>
<header><div class="brand">
<svg viewBox="0 0 24 32" aria-hidden="true"><polygon points="14,1 2,18 10,18 7,31 22,12 13,12" fill="#ffc81f" stroke="#0a1b3d" stroke-width="2" stroke-linejoin="round"/></svg>
<div><h1 class="disp">Thornleigh Thunderbolts</h1><p>Game-day lineup</p></div></div></header>
<main id="app"></main>
<footer><button class="link" id="rs">Reset game</button></footer>
<script>
const PLAYERS = ['Alex','Leo','Alistair','Gus','Harrison','Hamish','Luca','Liam','Caspar','Prim','Jian'];
const POSITIONS = ['Pitcher','Catcher','1st Base','2nd Base','3rd Base','Shortstop','Left Field','Centrefield','Right Field'];
const OUTFIELD = ['Left Field','Centrefield','Right Field'];

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const genOrder = (present) => shuffle(present);

// history: accepted innings, each {player: position|'Bench'}. Returns same shape, or null if impossible.
function genInning(present, history) {
  const n = present.length;
  if (n < 6) return null;
  const drop = n < 9 ? shuffle(OUTFIELD).slice(0, 9 - n) : [];
  const slots = POSITIONS.filter(p => !drop.includes(p));
  const everBenched = new Set(history.flatMap(h => present.filter(p => h[p] === 'Bench')));
  const pool = present.filter(p => !everBenched.has(p));
  const nBench = Math.max(0, n - 9);
  if (pool.length < nBench) return null;
  const bench = shuffle(pool).slice(0, nBench);
  const fielders = shuffle(present.filter(p => !bench.includes(p)));
  const out = {};
  bench.forEach(p => { out[p] = 'Bench'; });
  const used = new Set();
  const fill = (i) => {
    if (i === fielders.length) return true;
    const p = fielders[i];
    for (const pos of shuffle(slots)) {
      if (used.has(pos) || history.some(h => h[p] === pos)) continue;
      used.add(pos); out[p] = pos;
      if (fill(i + 1)) return true;
      used.delete(pos); delete out[p];
    }
    return false;
  };
  return fill(0) ? out : null;
}

const KEY = 'tball-roster-v1';
const MIN_PLAYERS = 6;
const fresh = () => ({ absent: [], order: null, innings: [], pending: null, error: null, orig: {} }); // orig: inning index -> lineup before manual edits
let state = fresh();
let lastAccept = 0;
const present = () => PLAYERS.filter(p => !state.absent.includes(p));

function load(raw) {
  try {
    if (raw === undefined) raw = localStorage.getItem(KEY);
    const s = JSON.parse(raw);
    const ok = s && Array.isArray(s.absent) && Array.isArray(s.innings) && (s.order === null || Array.isArray(s.order));
    state = ok ? { ...fresh(), ...s } : fresh();
  } catch { state = fresh(); }
}
let testing = false;
function save() { if (testing) return; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
function commit() { save(); if (typeof document !== 'undefined') render(); }

function nextInning() {
  const r = genInning(present(), state.innings);
  state.error = r ? null : "Can't fill every position without repeating one. Undo and try again.";
  return r;
}
function toggleAbsent(name) {
  if (state.order !== null || state.pending) return;
  const i = state.absent.indexOf(name);
  if (i < 0) state.absent.push(name); else state.absent.splice(i, 1);
  state.error = null; commit();
}
function startGame() {
  if (present().length < MIN_PLAYERS) { state.error = `Need at least ${MIN_PLAYERS} players.`; return commit(); }
  state.error = null; state.pending = genOrder(present()); commit();
}
function regenerate() {
  if (!state.pending && !state.error) return;
  if (state.order !== null) delete state.orig[state.innings.length];
  state.pending = state.order === null ? genOrder(present()) : nextInning();
  commit();
}
function accept() {
  if (!state.pending || Date.now() - lastAccept < 400) return; // ignore double-tap
  lastAccept = Date.now();
  if (state.order === null) { state.order = state.pending; state.pending = nextInning(); }
  else { state.innings.push(state.pending); state.pending = state.innings.length < 4 ? nextInning() : null; }
  commit();
}
function undo() {
  state.error = null;
  if (state.innings.length) state.pending = state.innings.pop();
  else if (state.order) { state.pending = state.order; state.order = null; }
  else state.pending = null;
  commit();
}
function reset() { state = fresh(); commit(); }

// Player `out` sits out inning map `map`; `sub` (a benched player, a fielder, or null) takes their position.
// A fielding sub leaves their old spot empty. Returns a new map.
function subOut(map, out, sub) {
  const m = { ...map }, pos = m[out];
  m[out] = 'Out';
  if (sub) m[sub] = pos;
  return m;
}
const inningMap = (i) => i < state.innings.length ? state.innings[i] : (state.order && i === state.innings.length ? state.pending : null);
function setInning(i, m) { if (i < state.innings.length) state.innings[i] = m; else state.pending = m; }
function applySub(i, out, sub) {
  const m = inningMap(i);
  if (!m) return;
  if (!state.orig[i]) state.orig[i] = { ...m };
  setInning(i, subOut(m, out, sub));
  commit();
}
function revertInning(i) {
  if (!state.orig[i]) return;
  setInning(i, state.orig[i]); delete state.orig[i];
  commit();
}

function runSelfTest() {
  testing = true;
  const failures = [];
  const fail = (m) => { if (failures.length < 20) failures.push(m); };
  for (let n = 6; n <= 11; n++) {
    const present = PLAYERS.slice(0, n);
    for (let g = 0; g < 1000; g++) {
      const hist = [];
      for (let i = 0; i < 4; i++) {
        const r = genInning(present, hist);
        if (!r) { fail(`n=${n} inning ${i + 1}: null`); break; }
        const vals = present.map(p => r[p]);
        if (vals.some(v => !v)) { fail(`n=${n}: missing player`); break; }
        const field = vals.filter(v => v !== 'Bench');
        if (new Set(field).size !== field.length) fail(`n=${n}: duplicate position in inning`);
        if (field.some(v => !POSITIONS.includes(v))) fail(`n=${n}: bad position`);
        const wantBench = Math.max(0, n - 9);
        if (vals.length - field.length !== wantBench) fail(`n=${n}: bench count`);
        if (n >= 9 && field.length !== 9) fail(`n=${n}: not all positions filled`);
        if (n < 9) {
          const dropped = POSITIONS.filter(p => !field.includes(p));
          if (dropped.length !== 9 - n || dropped.some(p => !OUTFIELD.includes(p))) fail(`n=${n}: bad drop`);
        }
        for (const p of present) {
          if (hist.some(h => h[p] === r[p])) fail(`n=${n}: ${p} repeated ${r[p]}`);
        }
        hist.push(r);
      }
    }
  }
  // state layer
  const check = (c, m) => { if (!c) fail(m); };
  check(POSITIONS.every(p => POS_XY[p] && ZONE[p]), 'every position needs field coordinates and a zone');
  state = fresh(); PLAYERS.slice(0, 6).forEach(toggleAbsent); startGame();
  check(state.error && state.order === null && !state.pending, 'fewer than 6 present must error');
  state = fresh(); startGame(); accept(); accept();
  check(state.order && state.innings.length === 0, 'double accept must not add inning');
  lastAccept = 0; accept();
  check(state.innings.length === 1, 'accept adds inning');
  undo();
  check(state.innings.length === 0 && state.pending && state.order, 'undo reopens inning');
  for (let i = 0; i < 4; i++) { lastAccept = 0; accept(); }
  check(state.innings.length === 4 && state.pending === null, 'four innings then done');
  reset(); check(JSON.stringify(state) === JSON.stringify(fresh()), 'reset');
  load('{bad'); check(JSON.stringify(state) === JSON.stringify(fresh()), 'garbage json');
  load('{"absent":"x","innings":[]}'); check(JSON.stringify(state) === JSON.stringify(fresh()), 'bad shape');
  const sm = { A: 'Pitcher', B: 'Bench', C: 'Left Field' };
  const a = subOut(sm, 'A', 'B'); check(a.A === 'Out' && a.B === 'Pitcher' && a.C === 'Left Field', 'bench sub takes position');
  const b = subOut(sm, 'A', 'C'); check(b.A === 'Out' && b.C === 'Pitcher' && !Object.values(b).includes('Left Field'), 'outfield sub leaves old spot empty');
  const c = subOut(sm, 'A', null); check(c.A === 'Out' && !Object.values(c).includes('Pitcher'), 'leave empty');
  check(sm.A === 'Pitcher', 'subOut must not mutate');
  state = fresh(); startGame(); lastAccept = 0; accept();
  const who = Object.keys(state.pending)[0], was = state.pending[who];
  applySub(0, who, null);
  check(state.pending[who] === 'Out' && state.orig[0][who] === was, 'applySub edits pending and keeps original');
  revertInning(0);
  check(state.pending[who] === was && !state.orig[0], 'revertInning restores');
  state = fresh(); testing = false;
  return { ok: failures.length === 0, failures };
}
const ZONE = { Pitcher: 'bat', Catcher: 'bat', '1st Base': 'in', '2nd Base': 'in', '3rd Base': 'in', Shortstop: 'in', 'Left Field': 'out', Centrefield: 'out', 'Right Field': 'out', Bench: 'bench', Out: 'sit' };
const ABBR = { Pitcher: 'P', Catcher: 'C', '1st Base': '1B', '2nd Base': '2B', '3rd Base': '3B', Shortstop: 'SS', 'Left Field': 'LF', Centrefield: 'CF', 'Right Field': 'RF', Bench: 'Bench', Out: 'Out' };
const ORD = ['1st', '2nd', '3rd', '4th'];
// box centres in the 680x540 field viewBox
const POS_XY = { Pitcher: [340, 362], Catcher: [340, 510], '1st Base': [544, 372], '2nd Base': [410, 272], '3rd Base': [136, 372], Shortstop: [270, 272], 'Left Field': [132, 172], Centrefield: [340, 92], 'Right Field': [548, 172] };
let view = 'table', fieldInn = null, seenInn = -1, sel = null; // display-only, not saved; sel = {i, p} cell being edited

function fieldSvg(map) {
  const who = {};
  for (const p in map) who[map[p]] = p;
  const boxes = POSITIONS.map(pos => {
    const [x, y] = POS_XY[pos], name = who[pos];
    return `<g class="fz ${name ? ZONE[pos] : 'gone'}"><rect x="${x - 62}" y="${y - 28}" width="124" height="56" rx="10"/><text class="l" x="${x}" y="${y - 7}">${pos}</text><text class="n" x="${x}" y="${y + 17}">${name || ''}</text></g>`;
  }).join('');
  return `<svg class="fld" viewBox="0 0 680 550" role="img" aria-label="Field positions"><path class="grass" d="M340 500 L40 200 A420 420 0 0 1 640 200 Z"/><path class="dirt" d="M340 470 L475 345 L340 220 L205 345 Z"/><g class="base"><rect x="333" y="463" width="14" height="14" rx="2"/><rect x="469" y="339" width="12" height="12" rx="2"/><rect x="334" y="214" width="12" height="12" rx="2"/><rect x="199" y="339" width="12" height="12" rx="2"/></g>${boxes}</svg>`;
}

function render(keepH) { // keepH: px height to hold the view area at, so toggling views doesn't shift the scroll position
  const app = document.getElementById('app');
  const s = state, atPlayers = s.order === null && !s.pending;
  const err = s.error ? `<p class="err" role="alert">${s.error}</p>` : '';
  if (atPlayers) {
    const n = present().length;
    app.innerHTML = `<section class="panel"><h2 class="disp">Who's here today?</h2><p>Tap anyone who's missing.</p>${err}
      <div class="chips">${PLAYERS.map(p => `<button class="chip" aria-pressed="${s.absent.includes(p)}" data-p="${p}">${p}</button>`).join('')}</div>
      <div class="bar"><button class="btn go" id="go" ${n < MIN_PLAYERS ? 'disabled' : ''}>Continue with ${n} players</button></div></section>`;
    app.querySelectorAll('.chip').forEach(b => b.onclick = () => toggleAbsent(b.dataset.p));
    app.querySelector('#go').onclick = startGame;
    return;
  }
  const rows = s.order || s.pending || [];
  const inn = s.order === null ? -1 : s.innings.length;
  const head = `<tr><th>Batting order</th>${ORD.map((o, i) => `<th class="${i === inn && s.pending ? 'pv' : ''}">${o}</th>`).join('')}</tr>`;
  const cell = (p, i) => {
    const m = i < s.innings.length ? s.innings[i] : (i === inn ? s.pending : null);
    const v = m && m[p];
    const pv = i === inn && s.pending ? 'pv' : '';
    if (!v) return `<td class="${pv}"><span class="empty">–</span></td>`;
    const label = `<span class="fu">${v}</span><span class="ab">${ABBR[v]}</span>`;
    if (v === 'Bench') return `<td class="${pv}"><span class="pos bench">${label}</span></td>`;
    const ed = s.orig[i] && s.orig[i][p] !== v ? ' ed' : '';
    return `<td class="${pv}"><button class="pos ${ZONE[v]}${ed}" data-ci="${i}" data-p="${p}">${label}</button></td>`;
  };
  const body = rows.map((p, r) => `<tr class="${s.order === null ? 'pv' : ''}"><td><span class="no">${r + 1}</span>${p}</td>${ORD.map((_, i) => cell(p, i)).join('')}</tr>`).join('');
  const away = s.absent.length ? `<p class="away">Out today: <b>${s.absent.join(', ')}</b></p>` : '';
  let title, acceptLabel;
  if (s.order === null) { title = 'Batting order'; acceptLabel = 'Accept order'; }
  else if (s.pending || s.error) { title = `${ORD[inn]} inning`; acceptLabel = `Accept ${ORD[inn]}`; }
  else { title = 'Lineup is set'; }
  const avail = s.innings.length + (s.order && s.pending ? 1 : 0); // innings that have a lineup to draw
  if (inn !== seenInn) { seenInn = inn; fieldInn = null; }
  const fi = fieldInn !== null && fieldInn < avail ? fieldInn : avail - 1;
  const showField = view === 'field' && avail > 0;
  const fm = fi < s.innings.length ? s.innings[fi] : s.pending;
  const toggle = avail > 0 ? `<div class="views"><button class="pill ${showField ? '' : 'on'}" data-v="table">Table</button><button class="pill ${showField ? 'on' : ''}" data-v="field">Field</button><span class="sp"></span>${showField ? ORD.map((o, i) => `<button class="pill ${i === fi ? 'on' : ''}" data-i="${i}" ${i < avail ? '' : 'disabled'}>${o}</button>`).join('') : ''}</div>` : '';
  const sm = sel && !showField ? inningMap(sel.i) : null;
  if (!sm || !sm[sel.p]) sel = null;
  const sheet = sel ? (() => {
    const cur = sm[sel.p], covers = cur === 'Out' ? '' : '<p>Who covers?</p><div class="bar">' +
      Object.keys(sm).filter(q => sm[q] === 'Bench').map(q => `<button class="btn" data-sub="${q}">${q} <small>from bench</small></button>`).join('') +
      Object.keys(sm).filter(q => q !== sel.p && OUTFIELD.includes(sm[q])).map(q => `<button class="btn" data-sub="${q}">${q} <small>leaves ${sm[q]} empty</small></button>`).join('') +
      '<button class="btn" data-sub="">Leave empty</button></div>';
    return `<section class="panel sheet"><h2 class="disp">${sel.p}, ${ORD[sel.i]} inning</h2>${cur === 'Out' ? '<p>Sitting out.</p>' : `<p>${cur} · sits out</p>`}${covers}<div class="bar">${s.orig[sel.i] ? '<button class="btn" id="rv">Undo change</button>' : ''}<button class="link" id="cx">Cancel</button></div></section>`;
  })() : '';
  const benched = showField ? Object.keys(fm).filter(p => fm[p] === 'Bench') : [];
  const outs = showField ? Object.keys(fm).filter(p => fm[p] === 'Out') : [];
  const chips = (label, list, cls) => list.length ? `<p class="bench">${label}: ${list.map(p => `<span class="${cls}">${p}</span>`).join('')}</p>` : '';
  const main = showField ? fieldSvg(fm) + chips('Bench', benched, '') + chips('Out', outs, 'o') : `<table><thead>${head}</thead><tbody>${body}</tbody></table>${sheet}`;
  app.innerHTML = `<section class="panel"><div class="head"><h2 class="disp">${title}</h2><button class="link" id="un">Undo</button></div>${err}${away}
    ${s.pending ? `<div class="bar"><button class="btn go" id="ac">${acceptLabel}</button><button class="btn" id="rg">Regenerate</button></div>` : ''}</section><div id="v" style="min-height:${keepH || 0}px">${toggle}${main}</div>`;
  const on = (id, f) => { const e = app.querySelector(id); if (e) e.onclick = f; };
  on('#ac', accept); on('#rg', regenerate); on('#un', undo);
  app.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { const h = app.querySelector('#v').offsetHeight; const n = { i: +b.dataset.ci, p: b.dataset.p }; sel = sel && sel.i === n.i && sel.p === n.p ? null : n; render(h); });
  app.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { const { i, p } = sel; sel = null; applySub(i, p, b.dataset.sub || null); });
  on('#rv', () => { const i = sel.i; sel = null; revertInning(i); });
  on('#cx', () => { sel = null; render(); });
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const h = app.querySelector('#v').offsetHeight; view = b.dataset.v; render(h); });
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const h = app.querySelector('#v').offsetHeight; fieldInn = +b.dataset.i; render(h); });
}

if (typeof document !== 'undefined') {
  document.getElementById('rs').onclick = () => { if (confirm('Clear this game and start over?')) reset(); };
  if (location.hash === '#test') {
    const r = runSelfTest();
    document.getElementById('app').innerHTML = `<section class="panel"><h2>${r.ok ? 'PASS' : 'FAIL'}</h2><pre>${r.failures.join('\n')}</pre></section>`;
    console.log(r.ok ? 'PASS' : 'FAIL', r.failures);
  } else { load(); render(); }
}
</script>
</body>
</html>
